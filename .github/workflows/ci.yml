name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64, mac-mini-4]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python 3.12
        run: |
          PYTHON312="$(command -v python3.12)"
          "$PYTHON312" -c 'import platform, sys; assert sys.version_info[:2] == (3, 12); assert platform.system() == "Darwin"'
          "$PYTHON312" --version
      - name: Compile
        run: python3.12 -m compileall custom_components tests
      - name: Unit tests
        run: python3.12 -m unittest discover -s tests -v
